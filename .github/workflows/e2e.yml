name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    # Pinned rather than ubuntu-latest: `playwright install --with-deps` fails on
    # Ubuntu releases newer than the installed Playwright supports. Bump this
    # together with @playwright/test (ubuntu-26.04 needs Playwright >= 1.61).
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx -w packages/lib playwright install chromium --with-deps

      # The packed-tarball smoke test runs `videowright render`, which needs ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Playwright e2e tests
        run: npm run test:e2e -w packages/lib

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/lib/playwright-report/
          retention-days: 14
